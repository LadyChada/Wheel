<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วงล้อกินอะไรดี | เลดี้ชฎา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#140d16;--bg2:#241428;--card:#1f1424;--line:#3a2742;--tx:#fbf3e6;--mut:#b9a6bd;--gold:#f3c554;--rose:#ff5d93;--jade:#3fcf9b;--shadow:rgba(0,0,0,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff6ea;--bg2:#ffe3ee;--card:#fffdf8;--line:#ecd5c0;--tx:#2a1530;--mut:#7b6280;--gold:#b8801a;--rose:#d6366f;--jade:#0c8a63;--shadow:rgba(90,40,60,.2);color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent 70%),radial-gradient(700px 500px at -10% 40%,color-mix(in srgb,var(--rose) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:14px}
.avatar{width:84px;height:84px;flex:none;border-radius:50%;overflow:hidden;background:#000;border:2px solid var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 20%,transparent),0 10px 30px var(--shadow)}
.avatar img{width:150%;max-width:none;margin:-4% 0 0 -26%;display:block}
h1{margin:0;font-size:clamp(24px,7vw,32px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-top:3px}
header h1{flex:1}.snd{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:21px;line-height:1;display:grid;place-items:center}.snd:active{transform:scale(.92)}
.bubble{position:relative;margin:16px 0 4px;padding:12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:15px;min-height:50px;box-shadow:0 6px 20px var(--shadow)}
.bubble:before{content:"";position:absolute;top:-8px;left:34px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--gold)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;transition:background .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold),var(--rose));border-color:transparent;color:#2a0f1c;font-weight:700}
.stage{position:relative;display:grid;place-items:center;margin:10px auto 0;width:100%}
canvas{display:block;max-width:100%;filter:drop-shadow(0 18px 30px var(--shadow))}
.ptr{position:absolute;top:-6px;left:50%;width:34px;height:44px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.spin{display:block;width:100%;margin-top:18px;padding:17px;border:0;border-radius:18px;font-size:20px;font-weight:800;color:#2a0f1c;background:linear-gradient(135deg,var(--gold),#ffb36b 45%,var(--rose));box-shadow:0 10px 28px color-mix(in srgb,var(--rose) 35%,transparent);transition:transform .15s,opacity .2s}
.spin:active{transform:scale(.98)}
.spin:disabled{opacity:.55;cursor:wait}
.sec{margin-top:26px}
.sec h2{font-size:16px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h2 button{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline;padding:4px}
.list{display:flex;flex-wrap:wrap;gap:8px}
.dish{padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px}
.dish:hover{border-color:var(--gold)}
.empty{color:var(--mut);font-size:14px;margin:0}
footer{margin-top:34px;text-align:center;color:var(--mut);font-size:12px}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,4,14,.66);backdrop-filter:blur(6px)}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px var(--shadow);animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--jade) 20%,transparent);color:var(--jade);font-size:13px;font-weight:700}
.sheet h3{font-size:clamp(28px,8vw,38px);line-height:1.2;margin:10px 0 4px;font-weight:800;background:linear-gradient(120deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet h4{margin:18px 0 8px;font-size:15px}
.ing{display:flex;flex-wrap:wrap;gap:6px}
.ing span{padding:4px 11px;border-radius:10px;background:color-mix(in srgb,var(--gold) 14%,transparent);font-size:14px}
ol{margin:0;padding-left:22px}
ol li{margin:6px 0;font-size:15px}
.acts{display:flex;gap:10px;margin-top:22px}
.acts button{flex:1;padding:14px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:transparent}
.acts .pri{border:0;color:#2a0f1c;background:linear-gradient(135deg,var(--gold),var(--rose))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const SFX={tap(i){const f=PEN[(i||0)%7];tone(f,.14,"triangle",.14,0,f*1.4)},tick(){tone(1250+Math.random()*250,.045,"square",.045)},start(){[392,523,659,784].forEach((f,i)=>tone(f,.13,"triangle",.13,i*.06))},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",.15,i*.09));tone(2093,.6,"sine",.05,.45);tone(1568,.5,"sine",.05,.5)},pop(){tone(440,.1,"sine",.14,0,880)},close(){tone(560,.12,"triangle",.1,0,300)},dice(){for(let i=0;i<5;i++)tone(300+Math.random()*500,.05,"square",.04,i*.05)}};
function tickChk(){const s=winIdx(),n=performance.now();if(s!==lastSeg){lastSeg=s;if(n-lastT>42){lastT=n;SFX.tick()}}}
const SAY={idle:["สวัสดีค่ะ เลดี้ชฎาเอง เลือกหมวดแล้วกดหมุนได้เลย","คิดไม่ออกว่ากินอะไร ให้เลดี้ชฎาช่วยเลือกนะคะ","หิวแล้วใช่ไหมคะ มาหมุนวงล้อกัน"],spin:["ลุ้นๆ ค่ะ...","เมนูไหนจะโชคดีนะ","กำลังหมุน อย่าเพิ่งกดซ้ำนะคะ"],win:["วันนี้ต้อง <b>{x}</b> เลยค่ะ ปังไม่ไหว!","<b>{x}</b> มาแล้ว! ฟินแน่นอน","เลดี้ชฎาเลือกให้แล้ว: <b>{x}</b>"]};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const say=(k,x)=>{$("say").innerHTML=pick(SAY[k]).replace("{x}",x||"")};
const store={get(){try{return JSON.parse(localStorage.getItem("chada-h")||"[]")}catch(e){return[]}},set(v){try{localStorage.setItem("chada-h",JSON.stringify(v))}catch(e){}}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){items=cat===0?shuffle(FLAT).slice(0,20):MENU[cat-1].d;rot=0;draw();renderList()}
function renderCats(){const el=$("cats");el.innerHTML="";[ALL,...MENU].forEach((c,i)=>{const b=document.createElement("button");b.className="chip";b.type="button";b.setAttribute("aria-pressed",i===cat);b.textContent=c.e+" "+c.n;b.onclick=()=>{if(busy)return;SFX.tap(i);if(i===0)SFX.dice();cat=i;renderCats();build();say("idle")};el.appendChild(b)})}
function fit(){const w=Math.min($("cats").parentElement.clientWidth-8,430);size=Math.max(260,w);const r=window.devicePixelRatio||1;cv.width=size*r;cv.height=size*r;cv.style.width=cv.style.height=size+"px";ctx.setTransform(r,0,0,r,0,0);draw()}
function draw(){const c=size/2,R=c-10,n=items.length,a=TAU/n;ctx.clearRect(0,0,size,size);
ctx.save();ctx.translate(c,c);ctx.rotate(rot);
for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*a,(i+1)*a);ctx.closePath();ctx.fillStyle=COLORS[i%6];ctx.fill();ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1;ctx.stroke();
ctx.save();ctx.rotate((i+.5)*a);ctx.fillStyle="#fff";ctx.textAlign="right";ctx.textBaseline="middle";let fs=Math.max(10,Math.min(14,size/27)),maxw=R-Math.max(36,size*.12)-26;
ctx.font="600 "+fs+"px Prompt,sans-serif";let t=items[i].name;while(ctx.measureText(t).width>maxw&&t.length>3)t=t.slice(0,-1);if(t!==items[i].name)t=t.slice(0,-1)+"…";ctx.fillText(t,R-12,0);ctx.restore()}
ctx.restore();
ctx.beginPath();ctx.arc(c,c,R,0,TAU);ctx.strokeStyle="#f3c554";ctx.lineWidth=7;ctx.stroke();
for(let i=0;i<n;i++){const t=i*a+rot,x=c+Math.cos(t)*R,y=c+Math.sin(t)*R;ctx.beginPath();ctx.arc(x,y,3.2,0,TAU);ctx.fillStyle="#fff7d6";ctx.fill()}
const hub=Math.max(36,size*.12),g=ctx.createRadialGradient(c,c,4,c,c,hub);g.addColorStop(0,"#fff0b8");g.addColorStop(1,"#d99a1c");ctx.beginPath();ctx.arc(c,c,hub,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="#7a4a00";ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle="#7a1d3f";let hf=14;ctx.font="800 "+hf+"px Prompt,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";while(ctx.measureText("เลดี้ชฎา").width>hub*1.64&&hf>8){hf--;ctx.font="800 "+hf+"px Prompt,sans-serif"}ctx.fillText("เลดี้ชฎา",c,c+1)}
function winIdx(){const a=TAU/items.length;return Math.floor(mod(-Math.PI/2-rot,TAU)/a)%items.length}
function spin(){if(busy)return;busy=true;SFX.start();lastSeg=winIdx();$("spin").disabled=true;$("spin").textContent="กำลังหมุน...";say("spin");closeSheet();
const n=items.length,a=TAU/n,t=Math.floor(Math.random()*n),fin=-Math.PI/2-(t+.5+(Math.random()-.5)*.6)*a,r0=mod(rot,TAU),delta=mod(fin-r0,TAU)+(5+Math.floor(Math.random()*3))*TAU;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,dur=reduce?600:5200,t0=performance.now();
(function f(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);rot=r0+delta*e;tickChk();draw();if(p<1)requestAnimationFrame(f);else{rot=mod(rot,TAU);draw();done()}})(t0)}
function done(){busy=false;$("spin").disabled=false;$("spin").textContent="หมุนอีกครั้ง!";const d=items[winIdx()];last=d;SFX.win();say("win",d.name);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
hist=[d.name,...hist.filter(x=>x!==d.name)].slice(0,8);store.set(hist);renderHist();show(d)}
let prevFocus=null;
function show(d){prevFocus=document.activeElement;$("rc").textContent=d.cat;$("rt").textContent=d.name;$("ri").innerHTML="";d.ing.forEach(x=>{const s=document.createElement("span");s.textContent=x;$("ri").appendChild(s)});$("rs").innerHTML="";d.st.forEach(x=>{const l=document.createElement("li");l.textContent=x;$("rs").appendChild(l)});$("ov").classList.add("on");$("sheet").scrollTop=0;$("again").focus()}
function closeSheet(){if(!$("ov").classList.contains("on"))return;$("ov").classList.remove("on");if(prevFocus&&prevFocus.focus)try{prevFocus.focus()}catch(e){}}
function renderList(){$("lt").textContent=cat===0?"20 เมนูสุ่มจากทุกหมวด":"เมนูในวงล้อ: "+MENU[cat-1].n;$("shuf").hidden=cat!==0;const l=$("list");l.innerHTML="";items.forEach(d=>{const b=document.createElement("button");b.type="button";b.className="dish";b.textContent=d.name;b.onclick=()=>{SFX.pop();show(d)};l.appendChild(b)})}
function renderHist(){const h=$("hist");h.innerHTML="";if(!hist.length){h.innerHTML='<p class="empty">ยังไม่มีเมนู กดหมุนเพื่อเริ่มเลย</p>';return}hist.forEach(nm=>{const d=FLAT.find(x=>x.name===nm);if(!d)return;const b=document.createElement("button");b.type="button";b.className="dish";b.textContent=nm;b.onclick=()=>{SFX.pop();show(d)};h.appendChild(b)})}
$("spin").onclick=spin;
const sb=$("snd");function sndUI(){sb.textContent=soundOn?"🔊":"🔇";sb.setAttribute("aria-label",soundOn?"ปิดเสียง":"เปิดเสียง")}
sb.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("chada-s",soundOn?"1":"0")}catch(e){}sndUI();if(soundOn)SFX.tap(2)};sndUI();
$("again").onclick=()=>{closeSheet();spin()};
$("cl").onclick=()=>{SFX.close();closeSheet()};
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Tab"&&$("ov").classList.contains("on")){const f=[$("cl"),$("again")],i=f.indexOf(document.activeElement);if(i===-1){e.preventDefault();f[0].focus()}else if(e.shiftKey&&i===0){e.preventDefault();f[1].focus()}else if(!e.shiftKey&&i===1){e.preventDefault();f[0].focus()}}});
$("shuf").onclick=()=>{if(!busy){SFX.dice();build()}};
$("clr").onclick=()=>{hist=[];store.set(hist);renderHist()};
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(fit,120)});
hist=store.get().filter(x=>FLAT.some(d=>d.name===x));
renderCats();build();renderHist();say("idle");
fit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
</script>
</body>
</html>
